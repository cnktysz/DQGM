[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dqgm"
version = "0.1.0"
description = "Quantum Fourier Generative Models trainable at large scale (DQGM)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.8",
    "optax>=0.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "qiskit>=2.0",
    "qiskit-aer>=0.16",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.6",
]

[project.optional-dependencies]
maestro = [
    "qoro-maestro>=0.3.5",
]

[tool.setuptools]
packages = ["dqgm"]
